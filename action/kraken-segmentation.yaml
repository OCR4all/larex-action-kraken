version: 1
id: kraken-segmentation
name: Kraken Segmentation
description: Runs Kraken OCR baseline segmentation on selected page images and imports PAGE XML.
category: LAYOUT
targets:
  - PAGE
  - REGION

endpoint:
  url: https://kraken.example.org/dispatch
  healthUrl: https://kraken.example.org/health
  preflightUrl: https://kraken.example.org/preflight
  parameterValuesUrl: https://kraken.example.org/parameter-values
  timeoutSeconds: 30
  auth:
    type: hmac
    secretRef: kraken-segmentation-v1

access:
  execute: CURATOR

locking:
  mode: PAGES

inputs:
  images:
    level: required
  xml:
    level: optional
    requiredForTargets:
      - REGION

outputs:
  xml:
    enabled: true
    mode: upsert
  images:
    enabled: false

concurrency:
  maxActiveRuns: 1
  scope: PROJECT

parameters:
  segmentationModel:
    type: string
    default: ""
    description: Kraken segmentation model; the processor default uses its built-in or configured model.
    allowedValues:
      provider: krakenSegmentationModels
