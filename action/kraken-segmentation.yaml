version: 1
id: kraken-segmentation
name: Kraken Segmentation
description: Runs Kraken OCR baseline segmentation on selected page images and imports PAGE XML.
category: LAYOUT
targets:
  - PAGE

endpoint:
  url: http://10.80.213.10/kraken-dev/dispatch
  healthUrl: http://10.80.213.10/kraken-dev/health
  timeoutSeconds: 30
  auth:
    type: hmac
    secretRef: kraken-dev-segmentation-v1

access:
  execute: CURATOR

locking:
  mode: PAGES

inputs:
  images:
    level: required

outputs:
  xml:
    enabled: true
    mode: upsert
  images:
    enabled: false

concurrency:
  maxActiveRuns: 1
  scope: PROJECT

parameters:
  device:
    type: string
    default: cuda:0
    description: Compute device for inference (e.g. 'cpu', 'cuda:0',...).
  model:
    type: string
    description: Custom Kraken segmentation model. If omitted, Kraken's default segmentation model is used.
  mode:
    type: string
    default: all
    description: Segmentation output to generate. The effective output is limited by what the selected model provides. [lines, regions, all]
  fallback:
    type: number
    description: Fallback bounding box height (in pixels) used when text line polygonization fails.
  sort:
    type: boolean
    default: false
    description: Sort regions/lines according to the model's reading-order heuristics after segmentation.