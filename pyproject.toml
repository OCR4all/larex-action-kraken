[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "larex-action-kraken"
version = "0.3.0"
description = "Kraken-based LAREX Actions processor for PAGE XML layout segmentation and OCR workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "OCR4all" }
]
dependencies = [
    "larex-action-sdk[fastapi]>=0.11.0",
    "octopy",
    "pillow>=12.3.0",
    "uvicorn[standard]>=0.38,<0.39",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]
dev = [
    "types-lxml>=2026.2.16",
]

[tool.uv.sources]
octopy = { git = "https://github.com/jahtz/octopy" }

[tool.hatch.build.targets.wheel]
packages = ["src/larex_action_kraken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff.lint.isort]
lines-after-imports = 2
