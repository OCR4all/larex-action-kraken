[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "larex-action-kraken"
version = "0.4.0"
description = "Kraken-based LAREX Actions processor for PAGE XML layout segmentation and OCR workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "OCR4all" }
]
dependencies = [
  "kraken==7.0.2",
  "larex-action-sdk[fastapi]>=0.12.0,<0.13",
  "lxml>=5,<7",
  "pillow>=10,<13",
  "uvicorn[standard]>=0.38,<0.39",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/larex_action_kraken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.semantic_release]
build_command = """
python -m pip install --disable-pip-version-check \"uv>=0.8,<1\"
uv lock --upgrade-package \"$PACKAGE_NAME\"
git add uv.lock
uv build
"""
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
